# Warmup-only run for memory A/B test.
# Runs Day 0 warmup + 2 loop days, then stops.
# Use the output directory as restart_from for the mem/nomem restart configs.
#
# Usage: python aisa_scripts/run_sim/submit_sim_aisa.py --config configs/allq_warmup_only_aisa.yaml --runs 1 --gpus 1 --memory 80 --time 12:00:00

# --- Simulation Meta ---
sim_name: "allq_warmup_only_aisa"
start_date: "2025-05-01"
end_date: "2025-04-25"       # Minimal loop: warmup day (04-24) + 1 day (04-25)
lookback_days: 7
search_cutoff_days: 0
split: "test"

# Load the FULL question set (resolution_end decoupled from end_date)
resolution_end: "2025-08-23"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "nikhilchandak/OpenForesight"
dataset_cache: "/mnt/nfs/datasets_ac/cache/huggingface/datasets"
min_forecasters: 10
resolved_only: true
output_base: "logs/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "/mnt/nfs/datasets_ac/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/mnt/nfs/datasets_ac/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_actions: 10
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
