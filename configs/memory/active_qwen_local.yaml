# Active-memory run for local vLLM Qwen 3.5 4B memory experiments on AISA.
# Restart from `warmup_qwen.yaml`; do not bake a shared restart path into
# this config. Pass it at submit time.
#
# Usage:
#   FSIM_VENV_PATH=${FSIM_REPO_DIR}/.venv-qwen35 \
#   python scripts/run_forecast_sim.py \
#     --config configs/memory/active_qwen_local.yaml \
#     --set restart_from=/path/to/qwen_shared_warmup_r00/<timestamp> \
#     --set restart_from_day=2025-04-25

# --- Restart ---
# Pass at submit time: --set restart_from=/path/to/run --set restart_from_day=2025-04-25

# --- Simulation Meta ---
sim_name: "qwen_active_mem_final"
start_date: "2025-05-01"
end_date: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- AISA Resources ---
resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  time: "2-00:00:00"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 65536
agent_max_model_len: 65536
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.7
vllm_tensor_parallel_size: 1
vllm_startup_timeout: 900
vllm_request_timeout: 300
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 2-GPU Pinning ---
# matcher + embedder on GPU1 (parent process), agent vLLM on GPU0 (subprocess override).
aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets (token budget is the only constraint) ---
  max_actions: null
  warmup_max_actions: null
  max_total_tokens: 65536
  warmup_max_total_tokens: 40960
  submit_reserve_tokens: 4096
  force_submit_threshold_tokens: 8192

  # --- Memory settings ---
  memory_max_entries: 500
  memory_update_max_total_tokens: 16384

agents:
  - model: "${FSIM_DEFAULT_MODEL_PATH}"
    provider: "vllm"
