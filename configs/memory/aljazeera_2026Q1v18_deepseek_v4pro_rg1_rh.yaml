# True 1-day warmup-only oracle run: deepseek-v4-pro on aljazeeraQ12026v18 with resolution_guard=1
# and reasoning effort = high. Per-question budget enlarged to leverage v4-pro's 1M context window.
# Each question's effective warmup date = its resolution_date - 1 day (per-question oracle).
# Requires BYOK DeepSeek key on openrouter (otherwise upstream rate-limits).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/memory/aljazeera_2026Q1v18_deepseek_v4pro_rg1_rh.yaml --runs 1

# --- Simulation Meta ---
sim_name: "ds_v4pro_rg1_rh_aljazeeraQ12026v18"
start_date: "2026-03-29"           # = end_date with lookback_days=0 => 1-day env loop
end_date: "2026-03-29"
resolution_start: "2026-01-01"
resolution_end: "2026-03-29"
lookback_days: 0
search_cutoff_days: 0
timegap_days: 1
resolution_guard: 1
split: "aljazeeraQ12026v18"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 32768               # 4x v16 (matcher is openrouter so unused, kept for parity)

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 32768                # 4x v16 (was 8192) — leverages v4-pro 1M context
  max_retries: 3
  reasoning:
    effort: high

  # --- Context-window budgets (scaled for v4-pro 1M ctx) ---
  warmup_max_actions: null
  warmup_max_total_tokens: 204800  # 5x v16 (was 40960)
  submit_reserve_tokens: 16384     # 4x v16 (was 4096) — matches max_tokens
  force_submit_threshold_tokens: 32768  # 4x v16 (was 8192) — matches max_tokens

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 150

agents:
  - model: "deepseek/deepseek-v4-pro"
    provider: "openrouter"
