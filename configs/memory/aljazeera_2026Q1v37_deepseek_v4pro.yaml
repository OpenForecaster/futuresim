# Active memory run on aljazeeraQ12026v37 split with deepseek-v4-pro and reasoning effort = xhigh.
# Mirrors configs/memory/aljazeera_2026Q1v35_deepseek_v4pro.yaml but targets the v37 split.
# Requires BYOK DeepSeek key on openrouter (otherwise upstream rate-limits).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/memory/aljazeera_2026Q1v37_deepseek_v4pro.yaml --runs 1

# --- Simulation Meta ---
sim_name: "ds_v4pro_active_mem_aljazeeraQ12026v37"
start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1
split: "aljazeeraQ12026v37"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 32768

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 65536
  max_retries: 3
  enable_memory: true
  memory_format: "active"
  reasoning:
    effort: xhigh

  # --- Context-window budgets (scaled ~4x for v4-pro 1M ctx) ---
  max_actions: null
  warmup_max_actions: null
  max_total_tokens: 903680
  warmup_max_total_tokens: 524288
  submit_reserve_tokens: 131072
  force_submit_threshold_tokens: 131072

  # --- Memory settings ---
  memory_max_entries: 500
  memory_update_max_total_tokens: 131072

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 150

agents:
  - model: "deepseek/deepseek-v4-pro"
    provider: "openrouter"
