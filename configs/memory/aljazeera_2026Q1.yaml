# Active memory run on aljazeeraQ12026 split (440 questions, Dec 31 2025 - Mar 30 2026).
# Mirrors configs/memory/aljazeera.yaml but targets the Q12026 split and matches
# the eval regime used by configs/minimalHarness/aljazeeraQ12026_deepseek_v32.yaml
# (resolved_only: false, min_forecasters: 0).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/memory/aljazeera_2026Q1.yaml --runs 1

# --- Simulation Meta ---
sim_name: "ds_active_mem_aljazeeraQ12026"
start_date: "2025-12-31"
end_date: "2026-03-30"
resolution_start: "2025-12-31"
resolution_end: "2026-03-30"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1
split: "aljazeeraQ12026"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets (replaces action budgets) ---
  max_actions: null                  # No action limit; token budget is the only constraint
  warmup_max_actions: null
  max_total_tokens: 163840           # Main loop context token budget
  warmup_max_total_tokens: 40960     # Per-question warmup token budget
  submit_reserve_tokens: 4096        # Warmup only (non-warmup days use unified loop, no reserve)
  force_submit_threshold_tokens: 8192 # Warmup only

  # --- Memory settings ---
  memory_max_entries: 500            # Max meta-insight entries (cross-question patterns; mem_df is unlimited)
  memory_update_max_total_tokens: 40960  # Non-warmup: triggers memory phase when this many tokens remain

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 150

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
