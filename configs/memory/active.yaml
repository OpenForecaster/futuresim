# Active memory run: mem_df + meta-insights, restarting from shared warmup.
#
# Usage: python scripts/run_forecast_sim.py --config configs/memory/active.yaml

# --- Restart from shared warmup ---
restart_from: ""
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "ds_active_mem_final"
start_date: "2025-05-01"
end_date: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "nikhilchandak/OpenForesight"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "logs/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_openrouter_provider_order: ["novita/fp8", "parasail/fp8", "deepseek"]
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Cheat Feedback (privileged directional-correctness before memory update) ---
# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  openrouter_provider_order: ["novita/fp8", "parasail/fp8", "deepseek"]
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets (replaces action budgets) ---
  max_actions: null                  # No action limit; token budget is the only constraint
  warmup_max_actions: null
  max_total_tokens: 163840           # Main loop context token budget
  warmup_max_total_tokens: 40960     # Per-question warmup token budget
  submit_reserve_tokens: 4096        # Warmup only (non-warmup days use unified loop, no reserve)
  force_submit_threshold_tokens: 8192 # Warmup only

  # --- Memory settings ---
  memory_max_entries: 500            # Max meta-insight entries (cross-question patterns; mem_df is unlimited)
  memory_update_max_total_tokens: 40960  # Non-warmup: triggers memory phase when this many tokens remain

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
