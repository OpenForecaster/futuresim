# AllQ active-memory warmup-only run on a 1-question subset of aljazeeraQ12026v37
# with qwen/qwen3.6-plus. Mirrors aljazeera_2026Q1v37_qwen36plus_warmup_only.yaml
# but targets a tiny split (qid 307616) created to backfill the one question
# that the original warmup left without a forecast/mem entry.
#
# Split source: /fast/nchandak/datasets/OpenForesight/aljazeeraQ12026v37_q307616-00000-of-00001.parquet
# (1 row sliced from aljazeeraQ12026v37-00000-of-00001.parquet by qid==307616)
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/memory/aljazeera_2026Q1v37_qwen36plus_warmup_only_q307616.yaml --runs 1

# --- Simulation Meta ---
sim_name: "qwen36plus_allq_warmup_only_aljazeeraQ12026v37_q307616"
start_date: "2025-12-31"
end_date: "2025-12-24"       # Minimal loop: warmup day only (end<start)
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1
split: "aljazeeraQ12026v37_q307616"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37"
warmup_parallelism: 1

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3
  enable_memory: true
  memory_format: "active"
  # Alibaba's qwen/qwen3.6-plus only accepts tool_choice="auto" — see header
  # of the parent warmup-only config.
  warmup_memory_tool_choice: "auto"

  max_actions: null
  warmup_max_actions: null
  max_total_tokens: 163840
  warmup_max_total_tokens: 40960
  submit_reserve_tokens: 4096
  force_submit_threshold_tokens: 8192

  memory_max_entries: 500
  memory_update_max_total_tokens: 40960

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 90

agents:
  - model: "qwen/qwen3.6-plus"
    provider: "openrouter"
