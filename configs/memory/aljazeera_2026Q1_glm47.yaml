# Active memory run on aljazeera2026Q1 split with z-ai/glm-4.7.
# Mirrors configs/memory/aljazeera_2026Q1.yaml (deepseek) but swaps the agent model.
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/memory/aljazeera_2026Q1_glm47.yaml --runs 1

# --- Simulation Meta ---
sim_name: "glm47_active_mem_aljazeera2026Q1"
start_date: "2025-12-31"
end_date: "2026-03-30"
resolution_start: "2025-12-31"
resolution_end: "2026-03-30"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1
split: "aljazeera2026Q1"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3
  enable_memory: true
  memory_format: "active"

  max_actions: null
  warmup_max_actions: null
  max_total_tokens: 163840
  warmup_max_total_tokens: 40960
  submit_reserve_tokens: 4096
  force_submit_threshold_tokens: 8192

  memory_max_entries: 500
  memory_update_max_total_tokens: 40960

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "z-ai/glm-4.7"
    provider: "openrouter"
