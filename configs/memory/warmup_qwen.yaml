# Shared warmup run for local vLLM Qwen 3.5 4B memory experiments on AISA.
# Run this once, then restart from it with `active_qwen_local.yaml`.
#
# Usage:
#   FSIM_VENV_PATH=${FSIM_REPO_DIR}/.venv-qwen35 \
#   python aisa_scripts/run_sim/submit_sim_aisa.py \
#     --config configs/memory/warmup_qwen.yaml --runs 1
#
# After warmup completes, restart with:
#   --set restart_from=/path/to/warmup/output --set restart_from_day=2025-04-25

# --- Simulation Meta ---
sim_name: "qwen_shared_warmup"
start_date: "2025-05-01"
end_date: "2025-04-25"       # Minimal loop: warmup day (04-24) + 1 day (04-25)
lookback_days: 7
search_cutoff_days: 0
split: "test"

# Load the FULL question set (resolution_end decoupled from end_date)
resolution_end: "2025-08-23"

# --- AISA Resources ---
resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  time: "12:00:00"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 65536
agent_max_model_len: 65536
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.7
vllm_tensor_parallel_size: 1
vllm_startup_timeout: 900
vllm_request_timeout: 300
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 2-GPU Pinning ---
# matcher + embedder on GPU1 (parent process), agent vLLM on GPU0 (subprocess override).
aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets (token budget is the only constraint) ---
  max_actions: null
  warmup_max_actions: null
  max_total_tokens: 65536
  warmup_max_total_tokens: 40960
  submit_reserve_tokens: 4096
  force_submit_threshold_tokens: 8192

  # --- Memory settings ---
  memory_max_entries: 500
  memory_update_max_total_tokens: 16384

agents:
  - model: "/mnt/nfs/datasets_ac/models/Qwen3.5-4B"
    provider: "vllm"
