# Full AISA memory run for local vLLM Qwen 3.5 27B.
# This runs the Day 0 warmup and then continues through the full evaluation window.
#
# Usage:
#   FSIM_VENV_PATH=${FSIM_REPO_DIR}/.venv-qwen35 \
#   python aisa_scripts/run_sim/submit_sim_aisa.py \
#     --config configs/memory/full_qwen_27b.yaml --runs 1
#
# Notes:
# - Stage the checkpoint at /mnt/nfs/datasets_ac/models/Qwen3.5-27B before submitting.
# - Requests 3 GPUs: GPU2 for matcher + embedder, GPU0-1 for the 27B agent.


# --- Restart from shared warmup ---
restart_from: "/mnt/nfs/home/ac146091/forecast-sim/logs/current_sim/qwen27b_active_mem_r00/base"
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "qwen27b_active_mem"
start_date: "2025-05-01"
end_date: "2025-08-23"
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- AISA Resources ---
resources:
  gpus: 3
  gpu_type: A100
  cpus: 24
  memory_gb: 256
  disk_gb: 50
  time: "2-00:00:00"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 32

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 262144
agent_max_model_len: 262144
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.85
vllm_tensor_parallel_size: 2
vllm_max_num_seqs: 64
vllm_startup_timeout: 900
vllm_request_timeout: 300
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 3-GPU Pinning ---
# matcher + embedder on GPU2 (parent process), agent vLLM on GPU0-1 (subprocess override).
aux_cuda_visible_devices: "2"
agent_cuda_visible_devices: "0,1"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  max_retries: 3
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets (token budget is the only constraint) ---
  max_actions: null
  warmup_max_actions: null
  max_total_tokens: 262144
  warmup_max_total_tokens: 262144
  submit_reserve_tokens: 8192
  force_submit_threshold_tokens: 16384

  # --- Memory settings ---
  memory_max_entries: 500
  memory_update_max_total_tokens: 40960

agents:
  - model: "/mnt/nfs/datasets_ac/models/Qwen3.5-27B"
    provider: "vllm"
