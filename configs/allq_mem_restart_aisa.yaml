# Memory A/B test: MEMORY ENABLED restart.
# Restarts from shared warmup run with enable_memory=true (default).
#
# Before using: replace <WARMUP_RUN_DIR> with the actual output directory
# from the warmup-only run (allq_warmup_only_aisa).
#
# Usage: python aisa_scripts/run_sim/submit_sim_aisa.py --config configs/allq_mem_restart_aisa.yaml --runs 1 --gpus 1 --memory 80 --time 2-00:00:00

# --- Restart ---
restart_from: "/mnt/nfs/home/ac146091/forecast-sim/logs/current_sim/allq_warmup_only_aisa_r00/26-02-22-00-17-36"
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "allq_mem_deepseek_aisa"
start_date: "2025-05-01"
end_date: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "nikhilchandak/OpenForesight"
dataset_cache: "/mnt/nfs/datasets_ac/cache/huggingface/datasets"
min_forecasters: 10
resolved_only: true
output_base: "logs/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "/mnt/nfs/datasets_ac/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/mnt/nfs/datasets_ac/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_actions: 10
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3
  enable_memory: true

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
