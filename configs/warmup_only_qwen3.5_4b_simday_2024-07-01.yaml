# AllQ warmup only on custom OpenForesight split `aljazeeraSept25`. First sim day is 2024-07-01;
# search sees articles through that day. (Questions in this split resolve in 2025, so they are still active on 2024-07-01.)
#
# Same date math as warmup_only_qwen3.5_4b_simday_2025-08-01.yaml.
#
# Usage:
#   bash scripts/submit_warmup_only_simday_2024-07-01.sh
#   python scripts/test_basic_agent.py --config configs/warmup_only_qwen3.5_4b_simday_2024-07-01.yaml

run_script: "run_sim.sh"

sim_name: "warmup_only_qwen3.5-4b_simday_2024-07-01_aljazeeraSept25"
start_date: "2024-07-08"
end_date: "2024-07-01"
lookback_days: 7
search_cutoff_days: 0
split: "aljazeeraSept25"

resolution_start: "2025-03-01"
resolution_end: "2025-12-31"

resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 65536
agent_max_model_len: 65536
embedding_max_model_len: 32768

vllm_gpu_mem: 0.7
vllm_tensor_parallel_size: 1
vllm_startup_timeout: 900
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

rate_limit: 32.0
parallel: true

defaults:
  provider: "vllm"
  scaffold: "allQ"
  max_actions: 50
  warmup_max_actions: 20
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/sgoel/models/Qwen3.5-4B-text"
    provider: "vllm"
