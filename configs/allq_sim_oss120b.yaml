# AllQAgent Simulation Configuration (GPT-OSS 120B, local vLLM)
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py --config configs/allq_sim_oss120b.yaml --runs 1
#
# Notes:
# - Uses checkpoint at /fast/nchandak/models/gpt-oss-120b (H100-only).
# - Agent uses 2 GPUs (tensor parallel), matcher + embedder share a 3rd GPU.

# --- Simulation Meta ---
sim_name: "allq_sim_oss120b"
start_date: "2025-05-01"
end_date: "2025-08-23"
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- HTCondor Resources ---
resources:
  gpus: 3
  cpus: 24
  memory_gb: 120
  disk_gb: 80
  bid: 35
  # H100 only (excludes B200), include 80GB+ cards, keep i103 excluded.
  requirements: "TARGET.CUDACapability == 9.0 && TARGET.CUDAGlobalMemoryMb >= 80000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0

# Shared max context used by vLLM (agent/matcher/embedding) in this runner.
max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.9
vllm_max_num_seqs: 8
vllm_tensor_parallel_size: 2
# 120B checkpoints can take >5m to load; avoid false startup timeouts.
vllm_startup_timeout: 1800
vllm_enable_tools: true

# --- Local 3-GPU Pinning ---
# matcher + embedder on GPU2 (parent process), agent vLLM on GPU0-1 (subprocess override).
aux_cuda_visible_devices: "2"
agent_cuda_visible_devices: "0,1"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "allQ"
  enable_memory: true
  # Replay only parser-safe structured items between tool turns.
  gptoss_replay_mode: "raw_recommended"
  # Reserve room for reasoning + visible output (OpenAI recommendation: start around 25k).
  gptoss_min_max_output_tokens: 25000
  max_actions: 10
  warmup_max_actions: 10
  temperature: 1.0
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/nchandak/models/gpt-oss-120b"
    provider: "vllm"
