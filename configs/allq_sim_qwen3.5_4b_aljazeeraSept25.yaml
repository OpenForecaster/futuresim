# AllQ 4B on custom OpenForesight split `aljazeeraSept25` (parquet next to train/test).
# Build parquet: python scripts/jsonl_to_openforesight_parquet.py --input ... --output-dir "${FSIM_DATASET_PATH}" --split aljazeeraSept25
#
# Narrow resolution window keeps Day-0 AllQ warmup tractable on HTCondor; widen dates for full split.
run_script: "run_sim.sh"

sim_name: "allq_sim_qwen3.5-4b_aljazeeraSept25_smoke"
start_date: "2025-10-29"
end_date: "2025-10-30"
resolution_start: "2025-10-29"
resolution_end: "2025-10-30"
lookback_days: 7
search_cutoff_days: 0
split: "aljazeeraSept25"

resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: null
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 262144
agent_max_model_len: 262144
embedding_max_model_len: 32768

vllm_gpu_mem: 0.7
vllm_tensor_parallel_size: 1
vllm_startup_timeout: 900
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

rate_limit: 32.0
parallel: true

defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  max_total_tokens: 262144
  warmup_max_total_tokens: 262144
  submit_reserve_tokens: 8192
  force_submit_threshold_tokens: 16384
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3

agents:
  - model: "/fast/sgoel/models/Qwen3.5-4B-text"
    provider: "vllm"
