# AllQ warmup on aljazeeraRecent2; sim/search day 2025-08-01; deepseek/deepseek-v3.2 (OpenRouter); reasoning effort high.
# Action cap: 10 per day and per warmup question (max_actions / warmup_max_actions).
# Parquet: ${FSIM_DATASET_PATH}/aljazeeraRecent2-00000-of-00001.parquet
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/warmup_only_openrouter_deepseek-v3.2_simday_2025-08-01_aljazeeraRecent2_actions10.yaml --runs 1
# Requires OPENROUTER_API_KEY in .env

run_script: "run_sim.sh"

sim_name: "warmup_only_openrouter_deepseek-v3.2_simday_2025-08-01_aljazeeraRecent2_actions10_reasoning_high"
start_date: "2025-08-08"
end_date: "2025-08-01"
lookback_days: 7
search_cutoff_days: 0
split: "aljazeeraRecent2"

resolution_start: "2025-03-01"
resolution_end: "2025-12-31"

resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 32

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192
embedding_max_model_len: 32768
vllm_startup_timeout: 900

rate_limit: 16.0
parallel: true

defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_actions: 10
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3
  reasoning:
    effort: high

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
