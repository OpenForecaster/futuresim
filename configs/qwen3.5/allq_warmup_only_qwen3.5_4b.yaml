# Warmup-only run using local Qwen3.5-4B via vLLM.
# Runs Day 0 warmup + 1 loop day, then stops.
# Uses resolution_guard=1 so each question's effective date = resolution_date - 1 day.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py --config configs/qwen3.5/allq_warmup_only_qwen3.5_4b.yaml --runs 1

# --- Run Script (CUDA 12.9 needed for Qwen3.5 FlashInfer GDN kernels) ---
run_script: "run_sim.sh"

# --- Simulation Meta ---
sim_name: "allq_warmup_only_qwen3.5-4b"
start_date: "2025-05-01"
end_date: "2025-04-25"       # Minimal loop: warmup day (04-24) + 1 day (04-25)
lookback_days: 7
search_cutoff_days: 0
resolution_guard: 1
split: "test"

# Load the FULL question set (resolution_end decoupled from end_date)
resolution_end: "2025-08-23"

# --- HTCondor Resources ---
resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDACapability < 10.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: null
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 262144
agent_max_model_len: 262144
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.7
vllm_tensor_parallel_size: 1
vllm_startup_timeout: 900
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 2-GPU Pinning ---
# matcher + embedder on GPU1 (parent process), agent vLLM on GPU0 (subprocess override).
aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  max_total_tokens: 262144
  warmup_max_total_tokens: 65536
  submit_reserve_tokens: 8192
  force_submit_threshold_tokens: 16384
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/sgoel/models/Qwen3.5-4B-text"
    provider: "vllm"
