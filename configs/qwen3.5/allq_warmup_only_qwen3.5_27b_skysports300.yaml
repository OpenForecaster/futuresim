# Warmup-only run for skysports_300 split using local Qwen3.5-27B via vLLM.
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/qwen3.5/allq_warmup_only_qwen3.5_27b_skysports300.yaml --runs 1

run_script: "run_sim2.sh"

# --- Simulation Meta ---
sim_name: "allq_warmup_only_qwen3.5-27b_skysports300"
start_date: "2025-05-12"
end_date: "2025-05-06"       # Minimal loop: warmup day + 1 day
lookback_days: 7
search_cutoff_days: 0
split: "skysports_300"

resolution_end: "2025-12-13"

# --- HTCondor Resources ---
resources:
  gpus: 3
  cpus: 24
  memory_gb: 128
  disk_gb: 50
  bid: 25
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "/fast/nchandak/datasets/OpenForesight"
min_forecasters: 10
resolved_only: true
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"
warmup_parallelism: 32

# --- Search Settings ---
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 65536
agent_max_model_len: 65536
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.85
vllm_tensor_parallel_size: 2
vllm_startup_timeout: 600
vllm_enable_tools: false
language_model_only: true

# --- Local 3-GPU Pinning ---
aux_cuda_visible_devices: "2"
agent_cuda_visible_devices: "0,1"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "allQ"
  max_actions: 50
  warmup_max_actions: 20
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/nchandak/models/Qwen3.5-27B-text"
    provider: "vllm"
