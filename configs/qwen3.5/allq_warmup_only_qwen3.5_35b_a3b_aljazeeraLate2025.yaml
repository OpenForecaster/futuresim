# Warmup-only run using local Qwen3.5-35B-A3B via vLLM on aljazeeraLate2025 split.
# Uses resolution_guard=1 so each question's effective date = resolution_date - 1 day.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py --config configs/qwen3.5/allq_warmup_only_qwen3.5_35b_a3b_aljazeeraLate2025.yaml --runs 1

# --- Run Script (CUDA 12.9 needed for Qwen3.5 FlashInfer GDN kernels) ---
run_script: "run_sim.sh"

# --- Simulation Meta ---
sim_name: "allq_warmup_only_qwen3.5-35b-a3b_aljazeeraLate2025"
start_date: "2025-09-01"
end_date: "2025-08-25"       # Minimal loop: warmup day + 1 day
lookback_days: 7
search_cutoff_days: 0
resolution_guard: 1
split: "aljazeeraLate2025"

# Load the FULL question set
resolution_end: "2025-12-13"

# --- HTCondor Resources ---
resources:
  gpus: 3
  cpus: 24
  memory_gb: 256
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.CUDAGlobalMemoryMb < 120000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 32

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 262144
agent_max_model_len: 262144
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.85
vllm_tensor_parallel_size: 2
vllm_max_num_seqs: 64
vllm_startup_timeout: 900
vllm_enable_expert_parallel: true
vllm_all2all_backend: "deepep_high_throughput"
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 3-GPU Pinning ---
aux_cuda_visible_devices: "2"
agent_cuda_visible_devices: "0,1"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  max_total_tokens: 262144
  warmup_max_total_tokens: 65536
  submit_reserve_tokens: 8192
  force_submit_threshold_tokens: 16384
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  max_tokens: 4096
  max_retries: 3

agents:
  - model: "/fast/sgoel/models/Qwen3.5-35B-A3B-text"
    provider: "vllm"
