# Warmup-only GPT-4.1-mini (OpenRouter) on the strict-hard subset of aljazeeraJanMar2026
# (oracle solved in all 3 completed oracle runs AND never solved by any July 2024-07-01 run).
# Warmup pinned to 2025-02-01 (~11 months before Jan-Mar 2026 resolutions).
#
# Requires OPENROUTER_API_KEY in .env.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py --config configs/qwen3.5/allq_warmup_only_gpt-4.1-mini_simday_2025-02-01_aljazeeraJanMar2026Hard.yaml --runs 1

run_script: "run_sim.sh"

sim_name: "allq_warmup_only_gpt-4.1-mini_simday_2025-02-01_aljazeeraJanMar2026Hard"
start_date: "2025-02-08"
end_date: "2025-02-01"       # Minimal loop: warmup day only (end<start)
lookback_days: 7
search_cutoff_days: 0
split: "aljazeeraJanMar2026Hard"

resolution_start: "2026-01-01"
resolution_end: "2026-03-30"

resources:
  gpus: 1
  cpus: 8
  memory_gb: 64
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 32

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192
embedding_max_model_len: 32768
vllm_startup_timeout: 900

rate_limit: 16.0
parallel: true

defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_actions: 50
  warmup_max_actions: 20
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3

agents:
  - model: "openai/gpt-4.1-mini"
    provider: "openrouter"
