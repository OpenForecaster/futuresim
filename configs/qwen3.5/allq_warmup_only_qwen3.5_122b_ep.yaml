# Warmup-only run using local Qwen3.5-122B-A10B (MoE) via vLLM pipeline parallel.
# Runs Day 0 warmup + 2 loop days, then stops.
# Use the output directory as restart_from for the mem/nomem restart configs.
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/qwen3.5/allq_warmup_only_qwen3.5_122b_ep.yaml --runs 1

# --- Run Script (CUDA 12.9 needed for Qwen3.5 FlashInfer GDN kernels) ---
run_script: "run_sim.sh"

# --- Simulation Meta ---
sim_name: "allq_warmup_only_qwen3.5-122b-ep"
start_date: "2025-05-01"
end_date: "2025-04-25"       # Minimal loop: warmup day (04-24) + 1 day (04-25)
lookback_days: 7
search_cutoff_days: 0
split: "test"

# Load the FULL question set (resolution_end decoupled from end_date)
resolution_end: "2025-08-23"

# --- HTCondor Resources ---
resources:
  gpus: 8
  cpus: 32
  memory_gb: 256
  disk_gb: 256
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 65536
agent_max_model_len: 65536
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
# Use pure pipeline parallel across the 7 agent GPUs.
# This avoids the unsupported EP=7 layout while still using all 7 model GPUs.
vllm_gpu_mem: 0.85
vllm_tensor_parallel_size: 1
vllm_data_parallel_size: 1
vllm_pipeline_parallel_size: 7
vllm_max_num_seqs: 64
vllm_startup_timeout: 1800
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 8-GPU Pinning ---
# matcher + embedder on GPU7 (parent process), agent vLLM on GPU0-6 (subprocess override).
aux_cuda_visible_devices: "7"
agent_cuda_visible_devices: "0,1,2,3,4,5,6"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "allQ"
  max_total_tokens: 65536
  warmup_max_total_tokens: 65536
  max_actions: 50
  warmup_max_actions: 20
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/sgoel/models/Qwen3.5-122B-A10B-text"
    provider: "vllm"
