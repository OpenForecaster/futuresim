# OgAgent (OpenForesight original prompt) configuration, single-answer mode.
# Uses the HF dataset's per-question `prompt` field, but surgically replaces only
# the scoring + output-format section. In `singleans` mode, the model must output:
#   <answer>...</answer>
#   <probability>...</probability>
#
# This run is configured to simulate a single day only (Day 0), but to load questions
# resolving across the standard window.

sim_name: "allq_og1ans_deepseek"
start_date: "2025-05-01"
end_date: "2025-05-01"
lookback_days: 0
search_cutoff_days: 0
split: "test"

# Load questions across the full window, even though we only run Day 0.
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"

dataset: "openforesight"
dataset_path: "/is/cluster/fast/sgoel/forecasting/qs/OpenForesight/data/"
dataset_cache: "/is/cluster/fast/sgoel/forecasting/qs/cache"
min_forecasters: 10
resolved_only: true
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"
warmup_parallelism: 64

# Search Settings (kept for parity with other runs; OgAgent prompt does not expose search actions)
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# Answer Matching
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# Inference Defaults
rate_limit: 32.0
parallel: true

defaults:
  provider: "openrouter"
  scaffold: "og"
  singleans: true
  max_actions: 10
  warmup_max_actions: 1
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"

