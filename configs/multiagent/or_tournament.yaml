# OpenRouter Model Tournament
# Different models competing on the same questions for comparison.
# Usage: python scripts/test_basic_agent.py --config configs/multiagent/or_tournament.yaml

# --- Simulation Meta ---
sim_name: "or_tournament"
start_date: "2025-05-01"
end_date: "2025-05-08"
resolution_start: "2025-05-01"
resolution_end: "2025-05-08"
lookback_days: 3
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
output_base: "${FSIM_OUTPUT_BASE}"

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
max_model_len: 8192

# --- Inference ---
rate_limit: 32.0
parallel: true

# --- Agents ---
defaults:
  provider: "openrouter"
  scaffold: "basic"
  max_actions: 5
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3
  enable_memory: true

agents:
  - model: "deepseek/deepseek-v3.2"

  - model: "google/gemini-2.5-flash"

  - model: "anthropic/claude-sonnet-4"
