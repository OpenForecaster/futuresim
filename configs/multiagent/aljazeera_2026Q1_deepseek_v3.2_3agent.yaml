# 3-agent active-memory run on the renamed v37 Al Jazeera 2026 Q1 split with deepseek-v3.2.
# The v37 question set is published on HF as split `aljazeera2026Q1`.
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/multiagent/aljazeera_2026Q1_deepseek_v3.2_3agent.yaml --runs 1

# --- Simulation Meta ---
sim_name: "ds_v32_active_mem_aljazeera2026Q1_3agent"
start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1
split: "aljazeeraQ12026v37"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7
articles_base: "${FSIM_NEWS_BASE}/deduped_articles/data"

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 32768
embedding_max_model_len: 32768

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 65536
  max_retries: 3
  reasoning:
    effort: "none"
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets (replaces action budgets) ---
  max_actions: null                  # No action limit; token budget is the only constraint
  warmup_max_actions: null
  max_total_tokens: 131072           # DeepSeek v3.2 OpenRouter context cap
  warmup_max_total_tokens: 131072    # Per-question warmup context cap
  submit_reserve_tokens: 8192        # Warmup only (non-warmup days use unified loop, no reserve)
  force_submit_threshold_tokens: 16384 # Warmup only

  # --- Memory settings ---
  memory_max_entries: 500            # Max meta-insight entries (cross-question patterns; mem_df is unlimited)
  memory_update_max_total_tokens: 65536  # Reserve half the context for daily memory updates

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 50

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
