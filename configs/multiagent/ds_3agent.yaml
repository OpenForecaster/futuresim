# 3-agent DeepSeek v3.2 self-play, restarting from shared warmup
# Usage: python scripts/run_forecast_sim.py --config configs/multiagent/ds_3agent.yaml

# Optional restart fields:
# restart_from: "${FSIM_OUTPUT_BASE}/deepseek_shared_warmup_3agent/<timestamp>"
# restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "ds_3agent"
start_date: "2025-05-01"
end_date: "2025-05-02"
lookback_days: 1
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference ---
rate_limit: 32.0
parallel: true

# --- Agents ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3
  warmup_parallelism: 64
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets ---
  max_actions: null                  # No action limit; token budget is the only constraint
  warmup_max_actions: null
  max_total_tokens: 163840           # Main loop context token budget
  warmup_max_total_tokens: 40960     # Per-question warmup token budget
  submit_reserve_tokens: 4096        # Warmup only (non-warmup days use unified loop, no reserve)
  force_submit_threshold_tokens: 8192 # Warmup only

  # --- Memory settings ---
  memory_max_entries: 500            # Max meta-insight entries (cross-question patterns; mem_df is unlimited)
  memory_update_max_total_tokens: 40960

agents:
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
