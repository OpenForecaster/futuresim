# 3-agent DeepSeek v3.2 self-play, restarting from shared warmup
# Usage: python aisa_scripts/run_sim/submit_sim_aisa.py --config configs/multiagent/ds_3agent.yaml --runs 1 --gpus 1 --gpu_type A40 --memory 80 --time 2-00:00:00

restart_from: "/mnt/nfs/home/ac146091/forecast-sim/logs/current_sim/deepseek_shared_warmup_3agent/26-03-22-11-32-28"
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "ds_3agent"
start_date: "2025-05-01"
end_date: "2025-05-02"
lookback_days: 1
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "nikhilchandak/OpenForesight"
dataset_cache: "/mnt/nfs/datasets_ac/cache/huggingface/datasets"
min_forecasters: 10
resolved_only: true
output_base: "logs/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "/mnt/nfs/datasets_ac/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/mnt/nfs/home/ac146091/forecast-sim/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference ---
rate_limit: 32.0
parallel: true

# --- Agents ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3
  warmup_parallelism: 64
  enable_memory: true
  memory_format: "active"

  # --- Context-window budgets ---
  max_actions: null                  # No action limit; token budget is the only constraint
  warmup_max_actions: null
  max_total_tokens: 163840           # Main loop context token budget
  warmup_max_total_tokens: 40960     # Per-question warmup token budget
  submit_reserve_tokens: 4096        # Warmup only (non-warmup days use unified loop, no reserve)
  force_submit_threshold_tokens: 8192 # Warmup only

  # --- Memory settings ---
  memory_max_entries: 500            # Max meta-insight entries (cross-question patterns; mem_df is unlimited)
  memory_update_max_total_tokens: 40960

agents:
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
