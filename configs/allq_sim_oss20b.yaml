# AllQAgent Simulation Configuration (GPT-OSS 20B, local vLLM)
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py --config configs/allq_sim_oss20b.yaml --runs 1
#
# Notes:
# - Uses the MXFP4 checkpoint at /fast/nchandak/models/gpt-oss-20b (H100-only).
# - `defaults.max_tokens` is per LLM call (per action/turn), not a budget across 10 actions.

# --- Simulation Meta ---
sim_name: "allq_sim_oss20b"
start_date: "2025-05-01"
end_date: "2025-08-23"
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- HTCondor Resources ---
# Submit script will infer these; no need to pass CLI flags.
resources:
  gpus: 2
  cpus: 16
  memory_gb: 96
  disk_gb: 50
  bid: 35
  # H100+ for MXFP4 + enough VRAM for 20B.
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0

# Shared max context used by vLLM (agent/matcher/embedding) in this runner.
max_model_len: 32768

# --- vLLM Agent Runtime ---
# This is for agent models (provider: vllm). Keep high for 20B.
vllm_gpu_mem: 0.92
vllm_max_num_seqs: 8
# Enable for GPT-OSS Harmony tool-calling agent path.
vllm_enable_tools: true

# --- Local 2-GPU Pinning ---
# Run matcher + embedder on GPU1 (parent process), agent vLLM servers on GPU0 (subprocess override).
aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "allQ"
  enable_memory: true
  # GPT-OSS Harmony prompt placement A/B:
  # - "instructions" (baseline): put task text in Responses API `instructions`
  # - "first_user": prepend task text to first user message
  gptoss_prompt_mode: "instructions"
  # GPT-OSS Responses reasoning controls.
  gptoss_reasoning_effort: "medium"
  gptoss_include_reasoning: true
  # Replay only parser-safe structured items between tool turns.
  gptoss_replay_mode: "raw_recommended"
  # Reserve room for reasoning + visible output (OpenAI recommendation: start around 25k).
  gptoss_min_max_output_tokens: 25000
  max_actions: 10
  warmup_max_actions: 10
  temperature: 1.0
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/nchandak/models/gpt-oss-20b"
    provider: "vllm"
