# Memory A/B test: MEMORY DISABLED restart. Restarts from shared warmup run with enable_memory=false.
#
# Before using: replace <WARMUP_RUN_DIR> with the actual output directory from the warmup-only run (allq_warmup_only).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/allq_nomem_restart.yaml --runs 1

# --- Restart ---
# Set locally with --set restart_from=/path/to/run
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "allq_mem_gemini_3.1_pro_preview_testset-50actions"
start_date: "2025-05-01"
# end_date: "2025-12-14"
end_date: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  enable_memory: true
  max_actions: 50
  warmup_max_actions: 20
  temperature: 0.7
  max_tokens: 16384
  max_retries: 3

agents:
  - model: "google/gemini-3.1-pro-preview"
    provider: "openrouter"
