# OgAgent (OpenForesight original prompt) configuration.
# Uses the HF dataset's per-question `prompt` field, but overrides scoring/output format
# to match this codebase (<forecast>/<outcome> XML + multiclass Brier).
#
# Runs a single simulated day (Day 0 only): lookback_days=0 and end_date=start_date.

sim_name: "allq_og_deepseek"
start_date: "2025-05-01"
end_date: "2025-05-01"
lookback_days: 0
search_cutoff_days: 0
split: "test"

# Load questions that resolve in the same window as the standard allq runs,
# but run the simulation for a single day only (Day 0).
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"

dataset: "openforesight"
dataset_path: "/is/cluster/fast/sgoel/forecasting/qs/OpenForesight/data/"
dataset_cache: "/is/cluster/fast/sgoel/forecasting/qs/cache"
min_forecasters: 10
resolved_only: true
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"
warmup_parallelism: 64

# Search Settings (same as allq_sim_ds.yaml)
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.4

# Answer Matching
matching: "vllm"
matcher: "/fast/rolmedo/models/qwen3-4b-it-2507"
matcher_gpu_mem: 0.3
max_model_len: 8192

# Inference Defaults
rate_limit: 32.0
parallel: true

defaults:
  provider: "openrouter"
  scaffold: "og"
  # If true: OgAgent expects HF-style <answer>/<probability> output (single outcome).
  singleans: false
  max_actions: 10
  warmup_max_actions: 1
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
