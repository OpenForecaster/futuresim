# SkyRL fully async warmup-search training on OpenForesight, B200 6+2 learning-focused ablation.
#
# Purpose of this variant:
# - Keep the same proven B200 6 inference / 2 training topology.
# - Increase the prompt batch and rollout group size to test whether larger GRPO groups improve learning.
# - Add a small LR warmup and a modestly higher sampling temperature to improve early optimization
#   stability and rollout diversity without turning on a reference model.
#
# Submit with:
#   python mpi_scripts/skyrl_search/submit_skyrl_search_train.py \
#     --config configs/skyrl/skyrl_openforesight_search_warmup_qwen3.5_4b_fully_async_b200_6x2_roll8_b128.yaml --runs 1

sim_name: "skyrl_of_search_warmup_qwen3.5_4b_fully_async_b200_6x2_roll8_b128"
run_script: "run_skyrl_search_train_fully_async.sh"
mode: "train"

resources:
  gpus: 8
  cpus: 64
  memory_gb: 200
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDADeviceName == \"NVIDIA B200\""

job_env:
  FSIM_RAY_HEAP_MEMORY_BYTES: "8589934592"
  FSIM_RAY_OBJECT_STORE_BYTES: "4294967296"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

data:
  dataset_path: "${FSIM_DATASET_PATH}"
  train_split: "train"
  val_split: "test"
  lookback_days: 7
  global_sim_date: null
  max_train_questions: null
  max_val_questions: null
  resolution_start: null
  resolution_end: null
  seed: 42

search:
  search_db: "${FSIM_SEARCH_DB}"
  embedding_model: "${FSIM_EMBEDDING_MODEL}"
  embedding_gpu_mem: 0.10
  embedding_max_num_seqs: 64
  aux_cuda_visible_devices: null
  search_type: "hybrid"
  search_cutoff_days: 0
  search_min_days: 0
  max_snippet_chars: 1200
  allow_substring_match: true

agent:
  max_outcomes_per_question: 5
  max_search_results: 5
  warmup_max_actions: 10
  warmup_max_total_tokens: 32768
  warmup_submit_reserve_tokens: 0
  warmup_force_submit_threshold_tokens: 0

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

matcher_cache:
  enabled: true
  path: null

training:
  model_path: "${FSIM_SKYRL_MODEL_PATH}"
  project_name: "skyrl-search-agent"
  run_name: "skyrl_of_search_warmup_qwen3.5_4b_fully_async_b200_6x2_roll8_b128"
  ckpt_path: "${FSIM_SKYRL_CKPT_BASE}/{run_name}"
  export_path: "${FSIM_SKYRL_CKPT_BASE}/{run_name}/exports"
  log_path: "${FSIM_SKYRL_LOG_BASE}/{run_name}/infra"
  logger: "wandb"

  strategy: "fsdp2"
  ref_fsdp_cpu_offload: false
  placement:
    colocate_all: false
    colocate_policy_ref: true
    policy_num_gpus_per_node: 2
    ref_num_gpus_per_node: 2

  epochs: 1
  update_epochs_per_batch: 1
  train_batch_size: 128
  policy_mini_batch_size: 128
  critic_mini_batch_size: 128
  micro_forward_batch_size_per_gpu: 4
  micro_train_batch_size_per_gpu: 2
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false

  eval_batch_size: 160
  eval_before_train: true
  eval_interval: 20
  eval_n_samples_per_prompt: 1
  dump_eval_results: true

  max_prompt_length: 32768
  max_input_length: 32768
  flash_attn: true
  use_sample_packing: false

  n_samples_per_prompt: 8
  max_turns: 0
  use_conversation_multi_turn: true
  append_eos_token_after_stop_str_in_multi_turn: true

  # SkyRL's search example uses temperature=1.0 and nonzero warmup. We nudge in that direction
  # without changing the rest of the rollout stack too aggressively.
  temperature: 0.9
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  max_generate_length: 4096
  sampling_logprobs: null
  eval_sampling_logprobs: null
  stop_tokens:
    - "</tool_call>"

  learning_rate: 1.0e-6
  num_warmup_steps: 100
  max_grad_norm: 0.5
  use_kl_loss: false
  kl_loss_coef: 0.001
  grpo_norm_by_std: false
  tis_ratio_type: token
  token_tis_ratio_clip_high: 2.0
  fully_async:
    max_staleness_steps: 2
    # Fully async requires workers >= mini_batch_size; for batch 128 and staleness 2, 256 is the
    # midpoint heuristic between the floor (128) and capacity cap (384).
    num_parallel_generation_workers: 256

  inference_backend: "vllm"
  inference_num_engines: 6
  inference_tensor_parallel_size: 1
  run_engines_locally: true
  weight_sync_backend: "nccl"
  async_engine: true
  batched: false
  gpu_memory_utilization: 0.80
  inference_max_num_batched_tokens: 98304
  inference_max_num_seqs: 96
  inference_max_model_len: null
  max_env_workers: 64

  ckpt_interval: 20
  hf_save_interval: 200
  max_ckpts_to_keep: 5
