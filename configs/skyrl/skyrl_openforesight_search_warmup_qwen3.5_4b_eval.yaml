# SkyRL eval-only: with top-level `mode: eval`, `scripts/run_skyrl_openforesight_search.py` overrides
# Hydra to `trainer.epochs=0`, `eval_before_train=true`, `use_kl_loss=false`, and zero ckpt/HF save intervals.
# The `training.epochs` / `training.eval_before_train` fields below are ignored for those keys (keep for reference).
# Each launch rebuilds parquets under ``training.log_path`` (``.../prepared_parquet/``) and removes them after the job.
#
# Submit (HTCondor):
#   python mpi_scripts/skyrl_search/submit_skyrl_search_train.py \
#     --config configs/skyrl/skyrl_openforesight_search_warmup_qwen3.5_4b_eval.yaml --runs 1
#
# Local / login node (after `source .venv/bin/activate` + SkyRL extra deps):
#   bash mpi_scripts/skyrl_search/run_skyrl_search_train.sh configs/skyrl/skyrl_openforesight_search_warmup_qwen3.5_4b_eval.yaml

sim_name: "skyrl_of_search_warmup_qwen3.5_4b_eval"
run_script: "run_skyrl_search_train.sh"
mode: "eval"

resources:
  gpus: 4
  cpus: 48
  memory_gb: 384
  disk_gb: 200
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

data:
  dataset_path: "${FSIM_DATASET_PATH}"
  train_split: "train"
  val_split: "test"
  lookback_days: 7
  global_sim_date: null
  # Smoke-style eval: one train prompt (matches old testeval7c).
  max_train_questions: 1
  max_val_questions: null
  resolution_start: null
  resolution_end: null
  seed: 42

search:
  search_db: "${FSIM_SEARCH_DB}"
  embedding_model: "${FSIM_EMBEDDING_MODEL}"
  embedding_gpu_mem: 0.3
  aux_cuda_visible_devices: null
  search_type: "hybrid"
  search_cutoff_days: 0
  search_min_days: 0
  # Latest article date allowed in search: min(sim_date - search_cutoff_days, search_max_date). Aligns with fixed "as of" non-SkyRL evals.
  search_max_date: "2025-04-23"
  max_snippet_chars: 1200
  allow_substring_match: true

agent:
  max_outcomes_per_question: 5
  max_search_results: 5
  # When null, ``scripts/run_skyrl_openforesight_search.py`` env uses ``training.max_turns`` as action budget (BudgetTracker).
  warmup_max_actions: null
  warmup_max_total_tokens: 262144
  warmup_submit_reserve_tokens: 8192
  warmup_force_submit_threshold_tokens: 16384

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

training:
  model_path: "${FSIM_SKYRL_MODEL_PATH}"
  project_name: "skyrl-search-agent"
  run_name: "skyrl_of_search_warmup_qwen3.5_4b_eval"
  ckpt_path: "${FSIM_SKYRL_CKPT_BASE}/{run_name}"
  export_path: "${FSIM_SKYRL_CKPT_BASE}/{run_name}/exports"
  log_path: "${FSIM_SKYRL_LOG_BASE}/{run_name}/infra"
  logger: "wandb"

  strategy: "fsdp2"
  ref_fsdp_cpu_offload: false

  epochs: 1
  update_epochs_per_batch: 1
  train_batch_size: 128
  policy_mini_batch_size: 64
  critic_mini_batch_size: 64
  micro_forward_batch_size_per_gpu: 2
  micro_train_batch_size_per_gpu: 2

  eval_batch_size: 302
  eval_before_train: true
  eval_interval: 20
  eval_n_samples_per_prompt: 1
  dump_eval_results: true

  # Must cover long prepared prompts: SkyRL PromptDataset drops rows longer than this (8192 can empty the 1-row smoke train set).
  max_prompt_length: 262144
  max_input_length: 262144
  flash_attn: true
  use_sample_packing: false

  n_samples_per_prompt: 4
  max_turns: 25
  use_conversation_multi_turn: true
  append_eos_token_after_stop_str_in_multi_turn: true

  # Match Qwen3.5 forecast-sim defaults (see configs/qwen3.5/allq_sim_qwen3.5_4b.yaml ``defaults.*``).
  # Eval sampling mirrors these unless you set eval_* keys explicitly.
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  max_generate_length: 8192
  sampling_logprobs: null
  eval_sampling_logprobs: null
  stop_tokens:
    - "</tool_call>"

  learning_rate: 1.0e-6
  # Eval mode forces use_kl_loss=false in run_skyrl_openforesight_search.py (no ref FSDP).
  use_kl_loss: false
  kl_loss_coef: 0.001
  tis_ratio_type: null
  token_tis_ratio_clip_high: 2.0

  inference_backend: "vllm"
  inference_num_engines: 4
  inference_tensor_parallel_size: 1
  run_engines_locally: true
  weight_sync_backend: "nccl"
  async_engine: true
  gpu_memory_utilization: 0.6
  max_env_workers: 16

  # Overridden to 0 by ``run_skyrl_openforesight_search.py`` in mode=eval (SkyRL otherwise runs a
  # final HF export after zero training steps and often crashes). Values below apply if Hydra is
  # invoked without the launcher.
  ckpt_interval: 0
  hf_save_interval: 0
  max_ckpts_to_keep: 5

hydra_overrides:
  - "generator.inference_engine.engine_init_kwargs.language_model_only=true"
  - "generator.inference_engine.engine_init_kwargs.skip_mm_profiling=true"
