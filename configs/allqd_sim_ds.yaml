# AllQDailyAgent (allqd) Simulation Configuration
# Like allQ warmup, but runs per-question focused prediction EVERY day (no DF queries).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/allqd_sim_ds.yaml --runs 1

# --- Simulation Meta ---
sim_name: "allqd_sim_deepseek"
start_date: "2025-05-01" # Resolution window start
end_date: "2025-08-23"   # Resolution window end
lookback_days: 7         # Days before first resolution to start simulation
search_cutoff_days: 0    # Cap on search date based on current date in sim
split: "test"            # Dataset split: train, test, or validation

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "/is/cluster/fast/sgoel/forecasting/qs/OpenForesight/data/"
dataset_cache: "/is/cluster/fast/sgoel/forecasting/qs/cache"
min_forecasters: 10
resolved_only: true
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
# Leave search_db empty to disable search
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0         # OpenRouter requests/second
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allqd"
  # Per-question action budget in allqd:
  warmup_max_actions: 10
  warmup_parallelism: 64
  # (max_actions is unused by allqd, but kept for compatibility)
  max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
    # You can override defaults here

