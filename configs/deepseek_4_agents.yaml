# DeepSeek 4-Agent Simulation Configuration
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/deepseek_4_agents.yaml

# --- Simulation Meta ---
sim_name: "deepseekv32_selfplay"
start_date: "2025-05-01" 
end_date: "2025-08-23"   
lookback_days: 7         
search_cutoff_days: 0    
split: "test"            

# --- Data Paths ---
dataset: "/is/cluster/fast/sgoel/forecasting/qs/OpenForesight/data/"
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"

# --- Search Settings ---
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0         
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "basic"
  max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
