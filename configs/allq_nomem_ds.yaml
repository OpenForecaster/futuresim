# AllQAgent restart config with memory disabled (no memory prompt / no memory snapshots).
#
# Restarts an existing AllQ run from Day 1 onward. Day 0 in AllQ is warmup-only anyway.
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/allq_nomem_ds.yaml --runs 1

# --- Restart ---
# Set locally with --set restart_from=/path/to/run
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "allq_nomem_deepseek"
start_date: "2025-05-01" # Resolution window start (kept for completeness; restart drives sim date)
end_date: "2025-08-23"   # Resolution window end
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  enable_memory: false
  max_actions: 10
  warmup_max_actions: 10
  warmup_parallelism: 64
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"

