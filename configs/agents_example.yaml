# Example multi-agent configuration
# Usage: python scripts/test_basic_agent.py --agents_config configs/agents_example.yaml

# Global settings (optional, can be overridden per-agent)
defaults:
  provider: openrouter
  scaffold: basic
  max_queries: 3
  max_retries: 3
  temperature: 0.7
  max_tokens: 2048

# Agent definitions
agents:
  - model: xiaomi/mimo-v2-flash:free
  
  - model: mistralai/devstral-2512:free
