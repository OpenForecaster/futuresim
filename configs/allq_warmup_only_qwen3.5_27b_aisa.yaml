# Warmup-only AISA smoke run using local Qwen3.5-27B via vLLM with the Qwen-native AllQ scaffold.
# Runs Day 0 warmup + 2 loop days, then stops.
#
# Usage:
#   FSIM_VENV_PATH=${FSIM_REPO_DIR}/.venv-qwen35 \
#   FSIM_AGENT_MODEL_PATH=/mnt/nfs/datasets_ac/models/Qwen3.5-27B-text \
#   python aisa_scripts/run_sim/submit_sim_aisa.py \
#     --config configs/allq_warmup_only_qwen3.5_27b_aisa.yaml --runs 1
#
# Notes:
# - Stage the checkpoint and set FSIM_AGENT_MODEL_PATH before submitting.
# - Requests 3 GPUs: GPU2 for matcher + embedder, GPU0-1 for the 27B agent.

# --- Simulation Meta ---
sim_name: "qwenallq_warmup_only_qwen3.5-27b_aisa"
start_date: "2025-05-01"
end_date: "2025-04-25"       # Minimal loop: warmup day (04-24) + 1 day (04-25)
lookback_days: 7
search_cutoff_days: 0
split: "test"

# Load the FULL question set (resolution_end decoupled from end_date)
resolution_end: "2025-08-23"

# --- AISA Resources ---
resources:
  gpus: 3
  cpus: 24
  memory_gb: 256
  disk_gb: 50
  time: "12:00:00"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 65536
agent_max_model_len: 65536
embedding_max_model_len: 32768

# --- vLLM Agent Runtime ---
vllm_gpu_mem: 0.85
vllm_tensor_parallel_size: 2
vllm_max_num_seqs: 64
vllm_startup_timeout: 900
vllm_request_timeout: 300
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

# --- Local 3-GPU Pinning ---
# matcher + embedder on GPU2 (parent process), agent vLLM on GPU0-1 (subprocess override).
aux_cuda_visible_devices: "2"
agent_cuda_visible_devices: "0,1"

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "vllm"
  scaffold: "qwenallq"
  max_actions: 50
  warmup_max_actions: 20
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "${FSIM_AGENT_MODEL_PATH}"
    provider: "vllm"
