# Memory A/B test: MEMORY DISABLED restart.
# Restarts from shared warmup run with enable_memory=false.
#
# Before using: replace <WARMUP_RUN_DIR> with the actual output directory
# from the warmup-only run (allq_warmup_only_aisa).
#
# Usage: python scripts/run_forecast_sim.py --config configs/shared/allq_nomem_restart_aisa.yaml

# --- Restart ---
# Set locally with --set restart_from=/path/to/run
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "allq_nomem_deepseek_aisa_skysports2025"
start_date: "2025-05-01"
end_date: "2025-12-14"
lookback_days: 7
search_cutoff_days: 0
split: "skysports2025"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  enable_memory: false
  max_actions: 10
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
