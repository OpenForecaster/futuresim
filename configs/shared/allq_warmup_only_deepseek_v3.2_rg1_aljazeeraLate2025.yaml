# Warmup-only run using DeepSeek V3.2 via OpenRouter on aljazeeraLate2025 split.
# Uses resolution_guard=1 so each question's effective date = resolution_date - 1 day.
#
# Usage:
#   python scripts/run_forecast_sim.py --config configs/shared/allq_warmup_only_deepseek_v3.2_rg1_aljazeeraLate2025.yaml

# --- Run Script ---
run_script: "run_sim.sh"

# --- Simulation Meta ---
sim_name: "allq_warmup_only_deepseek-v3.2_rg1_aljazeeraLate2025"
start_date: "2025-09-01"
end_date: "2025-08-25"       # Minimal loop: warmup day + 1 day
lookback_days: 7
search_cutoff_days: 0
resolution_guard: 1
split: "aljazeeraLate2025"

# Load the FULL question set
resolution_end: "2025-12-13"

# --- HTCondor Resources ---
resources:
  gpus: 1
  cpus: 8
  memory_gb: 64
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDACapability < 10.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192
embedding_max_model_len: 32768

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_total_tokens: 65536
  warmup_max_total_tokens: 65536
  submit_reserve_tokens: 8192
  force_submit_threshold_tokens: 16384
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
