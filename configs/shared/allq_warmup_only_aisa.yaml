# Warmup-only run for memory A/B test.
# Runs Day 0 warmup + 2 loop days, then stops.
# Use the output directory as restart_from for the mem/nomem restart configs.
#
# Usage: python scripts/run_forecast_sim.py --config configs/shared/allq_warmup_only_aisa.yaml

# --- Simulation Meta ---
sim_name: "allq_warmup_only_aisa_skysports2025"
start_date: "2025-05-01"
end_date: "2025-04-25"       # Minimal loop: warmup day (04-24) + 1 day (04-25)
lookback_days: 7
search_cutoff_days: 0
resolution_guard: null       # Warmup-only extra search cap: resolution_date - resolution_guard days
split: "skysports2025"

# Load the FULL question set (resolution_end decoupled from end_date)
resolution_end: "2025-12-15"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
dataset_cache: "${FSIM_DATASET_CACHE}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_actions: 10
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
