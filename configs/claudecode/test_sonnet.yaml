# Claude Code Sonnet 4.6 on test split (302 questions, May-Aug 2025)
sim_name: "claude_code_test_sonnet"

start_date: "2025-05-01"
end_date: "2025-08-23"
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "test"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "claudecode"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "claude-sonnet-4-6"
    timeout_seconds: 900
    claude_code_path: "/home/nchandak/.local/bin/claude"
