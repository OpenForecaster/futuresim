# AllQ warmup on aljazeeraRecent2; sim/search day 2025-08-01; local Qwen3-8B-RL via vLLM.
# Matches warmup_only_openrouter_gemini-3-flash_simday_2025-08-01_aljazeeraRecent2_actions20.yaml
# for dates, split, resources, warmup_parallelism (32), rate_limit (16), actions (20/20), matcher.
# vLLM layout matches warmup_only_qwen3.5_4b_simday_2025-08-01.yaml (2 GPUs: agent 0, embed 1).
# max_tokens 8192 here (OpenRouter twin uses 32768; lower for local generation stability on 8B).
#
# Model path must exist on workers (MPI): /fast/nchandak/forecasting/models/Qwen3-8B-RL
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/warmup_only_vllm_qwen3-8b-rl_simday_2025-08-01_aljazeeraRecent2_actions20.yaml --runs 1

run_script: "run_sim.sh"

sim_name: "warmup_only_vllm_qwen3-8b-rl_simday_2025-08-01_aljazeeraRecent2_actions20"
start_date: "2025-08-08"
end_date: "2025-08-01"
lookback_days: 7
search_cutoff_days: 0
split: "aljazeeraRecent2"

resolution_start: "2025-03-01"
resolution_end: "2025-12-31"

resources:
  gpus: 2
  cpus: 16
  memory_gb: 128
  disk_gb: 50
  bid: 55
  requirements: "TARGET.CUDACapability >= 9.0 && TARGET.CUDAGlobalMemoryMb > 70000 && TARGET.Machine =!= \"i103.internal.cluster.is.localnet\""

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
min_forecasters: 10
resolved_only: true
output_base: "${FSIM_OUTPUT_BASE}"
warmup_parallelism: 32

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
# Must not exceed model config (Qwen3-8B-RL: max_position_embeddings=40960; 65536 makes vLLM exit).
max_model_len: 40960
agent_max_model_len: 40960
embedding_max_model_len: 32768

vllm_gpu_mem: 0.7
vllm_tensor_parallel_size: 1
# Shard load can exceed 15m on shared I/O; allQ hit 900s timeout at 75% of 4 shards.
vllm_startup_timeout: 2400
vllm_enable_tools: true
vllm_tool_call_parser: "qwen3_coder"
language_model_only: true

aux_cuda_visible_devices: "1"
agent_cuda_visible_devices: "0"

rate_limit: 16.0
parallel: true

defaults:
  provider: "vllm"
  scaffold: "allQ"
  max_actions: 20
  warmup_max_actions: 20
  temperature: 0.7
  max_tokens: 8192
  max_retries: 3

agents:
  - model: "/fast/nchandak/forecasting/models/Qwen3-8B-RL"
    provider: "vllm"
