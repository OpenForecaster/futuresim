# Codex CLI + gpt-5.5 on aljazeeraQ12026v37, matching the normal
# gpt55_resume run, but with Day 0 supplied from fixedWarmup.
#
# Bootstrap: on the first sim day, the agent copies fixedWarmup/{mem.csv,
# meta.yaml} into workspace/memory/<sim_start-1>/ and prediction.json into
# predictions/<sim_start-1>.json, then injects those predictions into the env's
# histories so my_prediction propagates to the first market.csv.
#
# The normal run at
#   final_runs_v37/codex_aljazeeraQ12026v37_gpt55_resume/26-05-04-02-00-26
# live-ran 2025-12-24 as Day 0 with codex_resume=true. This config instead
# injects fixedWarmup as 2025-12-24 and starts the live Codex resume thread on
# 2025-12-25.
#
# Date math: lookback_days=6 + start_date=2025-12-31 => sim_start=2025-12-25,
# so the bootstrap "previous day" is 2025-12-24.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_codex_gpt55_resume_fixed_day0_bootstrap.yaml --runs 1

sim_name: "codex_aljazeeraQ12026v37_gpt55_resume_fixed_day0_bootstrap"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 6
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_NEWS_BASE}/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "codex"
  codex_path: "${HOME}/.local/bin/codex"
  reasoning_effort: "xhigh"
  prompt_mode: "default"
  codex_resume: true
  handholding_version: "v1"
  sandbox: true
  # Some Condor nodes reject `bwrap --proc`; host_ro keeps filesystem
  # sandboxing intact while binding /proc read-only.
  sandbox_proc_mode: "host_ro"
  network_isolation: true
  bootstrap_dir: "${FSIM_OUTPUT_BASE}/final_runs_v37/fixedWarmup"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 100

agents:
  - model: "gpt-5.5"
    timeout_seconds: 86400
