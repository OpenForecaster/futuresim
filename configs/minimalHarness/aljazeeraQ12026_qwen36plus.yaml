# opencode + qwen/qwen3.6-plus (via OpenRouter) on aljazeeraQ12026 split
# (434 questions, v11, Jan-Mar 2026). Mirrors aljazeeraQ12026_deepseek_v32.yaml.
# Reasoning effort: high (default in agent.py via --variant high).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/minimalHarness/aljazeeraQ12026_qwen36plus.yaml --runs 1

sim_name: "opencode_aljazeeraQ12026_qwen36plus"

start_date: "2025-12-31"
end_date: "2026-03-30"
resolution_start: "2025-12-31"
resolution_end: "2026-03-30"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "opencode"
  opencode_path: "/home/nchandak/.opencode/bin/opencode"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "qwen/qwen3.6-plus"
    timeout_seconds: 7200
