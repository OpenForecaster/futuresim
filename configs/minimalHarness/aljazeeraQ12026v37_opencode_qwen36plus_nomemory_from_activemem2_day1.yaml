# opencode + qwen/qwen3.6-plus no-memory run bootstrapped from the
# qwen/qwen3.6-plus active_memory2 run's Day 0 predictions.
#
# Purpose: compare active_memory2 vs no_memory with the same Qwen starting point.
# Bootstrap semantics:
#   - bootstrap_dir/market.csv is copied as the first workspace market.csv
#   - bootstrap_dir/prediction.json becomes workspace/predictions/2025-12-24.json
#     and is injected into env histories as 2025-12-24 predictions
#   - lookback_days=6 makes the first no_memory run day 2025-12-25
#   - no_memory strips memory/notes prompt state and keeps handholding at v1
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_opencode_qwen36plus_nomemory_from_activemem2_day1.yaml \
#     --runs 1

sim_name: "opencode_aljazeeraQ12026v37_qwen36plus_nomemory_activemem2_day0_bootstrap"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 6
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_NEWS_BASE}/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "opencode"
  opencode_path: "${HOME}/.opencode/bin/opencode"
  # no_memory => fresh opencode run per day and no memory/notes prompt state.
  prompt_mode: "no_memory"
  handholding_version: "v1"
  sandbox: true
  sandbox_proc_mode: "host_ro"
  bootstrap_dir: "${FSIM_OUTPUT_BASE}/final_runs_v37/fixedWarmup_qwen36plus_activemem2_day0"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "qwen/qwen3.6-plus"
    timeout_seconds: 7200
