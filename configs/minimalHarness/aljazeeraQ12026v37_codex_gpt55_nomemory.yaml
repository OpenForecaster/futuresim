# Codex CLI + gpt-5.5 (max reasoning) on aljazeeraQ12026v37 split with the
# no_memory prompt mode: the system prompt strips all references to
# memory/notes/SKILLS.md/MEMORY.md so the agent has no instruction to maintain
# persistent state. Each day spawns a fresh codex thread (codex_resume: false)
# so there is no in-context carryover either.
#
# Enforcement is prompt-only on the codex side (the system prompt strips memory
# guidance + says "you have no Write/Edit tools"). Unlike the Claude Code
# no_memory path which uses --disallowedTools, codex's natural read-only knob
# (-s read-only + approval_policy="never") was tried and broke MCP: it
# auto-cancels every MCP tool call (search_news, submit_forecasts, next_day) as
# "user cancelled MCP tool call", and `-s` is also rejected by `codex exec
# resume` (used by the harness retry path). Reverted to bypass + prompt-only.
#
# Usage:
#   python scripts/test_basic_agent.py --config configs/minimalHarness/aljazeeraQ12026v37_codex_gpt55_nomemory.yaml

sim_name: "codex_aljazeeraQ12026v37_gpt55_nomemory"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "codex"
  codex_path: "/home/nchandak/.local/bin/codex"
  reasoning_effort: "xhigh"
  # no_memory => fresh codex thread per day (no in-context carryover) AND
  # the system prompt does not advertise memory/notes/SKILLS.md.
  prompt_mode: "no_memory"
  codex_resume: false
  sandbox: true
  network_isolation: true
  handholding_version: "v1"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "gpt-5.5"
    timeout_seconds: 86400
