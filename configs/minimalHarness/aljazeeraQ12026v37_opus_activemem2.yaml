# Claude Code + claude-opus-4-6 on aljazeeraQ12026v37 with minimalHarness
# active_memory2: fresh Claude session each day, with memory edited through MCP
# ActiveMemory tools and persisted as memory/YYYY-MM-DD/{mem.csv,meta.yaml}.
#
# Mirrors the Codex/Qwen active_memory2 run shape while keeping the Claude Code
# backend settings that have been reliable on Condor for Opus.
#
# Usage after confirmation:
#   python mpi_scripts/run_sim/submit_sim.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_opus_activemem2.yaml \
#     --runs 1

sim_name: "claude_code_aljazeeraQ12026v37_opus_activemem2"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_NEWS_BASE}/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "claude_code"
  prompt_mode: "active_memory2"
  claude_code_resume: false
  handholding_version: "v3"
  sandbox: true
  sandbox_proc_mode: "host_ro"  # Condor execute nodes reject bwrap --proc.
  network_isolation: true

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 100

agents:
  - model: "claude-opus-4-6"
    timeout_seconds: 86400
    claude_code_path: "${HOME}/.local/bin/claude"
