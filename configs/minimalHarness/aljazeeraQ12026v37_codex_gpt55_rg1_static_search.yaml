# Codex CLI + gpt-5.5 on aljazeeraQ12026v37 with static title-search evidence.
# This ablates agent search behavior while keeping the per-question RG=1 warmup
# setup from aljazeeraQ12026v37_codex_gpt55_rg1_warmup.yaml.
#
# Static search files:
#   python scripts/build_static_search_cache.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_codex_gpt55_rg1_static_search.yaml \
#     --embedding_gpu_mem 0.4
#
# Run:
#   python scripts/run_forecast_sim.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_codex_gpt55_rg1_static_search.yaml \
#     \
#     --set defaults.codex_path="$(command -v codex)" \
#     --set defaults.reasoning_effort=low \
#     --set defaults.sandbox_proc_mode=host_ro \
#     --set resources.memory_gb=240 \
#     --set warmup_parallelism=64

sim_name: "codex_aljazeeraQ12026v37_gpt55_rg1_static_search_low"

start_date: "2026-03-28"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 0
search_cutoff_days: 0
timegap_days: 1
resolution_guard: 1
warmup_parallelism: 64

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_ARTICLES_BASE}"
static_search_dir: "${FSIM_OUTPUT_BASE}/static_search/aljazeeraQ12026v37_rg1_title_hybrid"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "codex"
  codex_path: "codex"
  reasoning_effort: "low"
  prompt_mode: "static_search"
  codex_resume: false
  sandbox: true
  static_search_dir: "${FSIM_OUTPUT_BASE}/static_search/aljazeeraQ12026v37_rg1_title_hybrid"
  static_search_max_results: 5

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "gpt-5.5"
    timeout_seconds: 86400
