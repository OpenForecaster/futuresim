# Codex CLI + gpt-5.5 (max reasoning) on the public aljazeera2026Q1 split.
# Same LanceDB/Qwen3 hybrid search setup as aljazeera2026Q1_codex_gpt55_lancedb_search.yaml,
# with prompt_mode=max_search for the day-0 research-pass experiment.

sim_name: "codex_aljazeera2026Q1_gpt55_max_search_lancedb_day0"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "nikhilchandak/OpenForesight"
split: "aljazeera2026Q1"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}"

search_backend: "lancedb"
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_ARTICLES_BASE}"

matching: "openrouter"
matcher: "deepseek/deepseek-v4-flash"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "codex"
  codex_path: "${CODEX_PATH}"
  reasoning_effort: "xhigh"
  codex_resume: true
  prompt_mode: "max_search"
  sandbox: true
  sandbox_proc_mode: "host_ro"
  network_isolation: true
  handholding_version: "v1"

agents:
  - model: "gpt-5.5"
    timeout_seconds: 86400
