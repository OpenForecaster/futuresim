# Claude Code -> z.ai (GLM-5.1) on aljazeeraQ12026v37 split with the
# active_memory prompt mode: fresh Claude session each day; mem.csv + meta.yaml
# are the only state bridge across days.
#
# Cold-start (no bootstrap) — Day 0 has no prior memory; agent builds it as it
# goes. Mirrors aljazeeraQ12026v37_opus_activemem.yaml but swaps the model and
# the Anthropic-compat endpoint (z.ai for GLM).
#
# Usage:
#   python scripts/test_basic_agent.py --config configs/minimalHarness/aljazeeraQ12026v37_glm51_activemem.yaml

sim_name: "claude_code_aljazeeraQ12026v37_glm51_activemem"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "claude_code"
  # active_memory => fresh claude session per day; mem.csv + meta.yaml are
  # the only bridge across days. Mutually exclusive with claude_code_resume.
  prompt_mode: "active_memory"
  claude_code_resume: false
  sandbox: true
  anthropic_base_url: "https://api.z.ai/api/anthropic"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "glm-5.1"
    timeout_seconds: 86400
    claude_code_path: "/home/nchandak/.local/bin/claude"
