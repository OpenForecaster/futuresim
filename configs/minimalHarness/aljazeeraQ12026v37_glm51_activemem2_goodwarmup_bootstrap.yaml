# Claude Code -> z.ai (GLM-5.1) on aljazeeraQ12026v37 with the active_memory2
# prompt mode, bootstrapped from goodWarmup.
#
# goodWarmup was built from the Codex GPT-5.5 active_memory2 run's Day 0
# artifacts:
#   /fast/sgoel/forecasting/current_sim/final_runs_v37/codex_aljazeeraQ12026v37_gpt55_activemem2_r00/26-05-05-03-30-56
#
# Bootstrap: on the first sim day, the agent copies goodWarmup/{mem.csv,
# meta.yaml} into workspace/memory/<sim_start-1>/ and prediction.json into
# predictions/<sim_start-1>.json, then injects those predictions into the env's
# histories so my_prediction propagates to Day 1 market.csv.
#
# Date math: lookback_days=6 + start_date=2025-12-31 => sim_start=2025-12-25,
# so the bootstrap "previous day" is 2025-12-24, matching goodWarmup.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_glm51_activemem2_goodwarmup_bootstrap.yaml --runs 1

sim_name: "claude_code_aljazeeraQ12026v37_glm51_activemem2_goodwarmup_bootstrap"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 6
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_NEWS_BASE}/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "claude_code"
  # active_memory2 => fresh claude session per day; memory files are
  # the only bridge across days. Mutually exclusive with claude_code_resume.
  prompt_mode: "active_memory2"
  claude_code_resume: false
  sandbox: true
  # Some Condor nodes reject `bwrap --proc`; host_ro keeps filesystem
  # sandboxing intact while binding /proc read-only.
  sandbox_proc_mode: "host_ro"
  # Egress through the host-side allowlist proxy. The default allowlist covers
  # api.z.ai:443 for the GLM Anthropic-compatible endpoint.
  network_isolation: true
  anthropic_base_url: "https://api.z.ai/api/anthropic"
  handholding_version: "v3"
  bootstrap_dir: "${FSIM_OUTPUT_BASE}/final_runs_v37/goodWarmup"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "glm-5.1"
    timeout_seconds: 86400
    claude_code_path: "${HOME}/.local/bin/claude"
