# Codex CLI + gpt-5.5 (low reasoning) on aljazeeraQ12026v37 split with RESUME
# mode. Search tool calls are capped at the first simulation day
# (start_date - lookback_days = 2025-12-24).
#
# Usage:
#   python scripts/test_basic_agent.py --config configs/minimalHarness/aljazeeraQ12026v37_codex_gpt55_resume_no_search_update.yaml

sim_name: "codex_aljazeeraQ12026v37_gpt55_resume_no_search_update"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
freeze_search_after_start: true
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_ARTICLES_BASE}"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "codex"
  codex_path: "/home/nchandak/.local/bin/codex"
  reasoning_effort: "low"
  codex_resume: true
  sandbox: true

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "gpt-5.5"
    timeout_seconds: 86400
