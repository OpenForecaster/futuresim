# Claude Code -> DeepSeek (deepseek-v4-pro) on aljazeeraQ12026v37 split with the
# no_memory prompt mode: the system prompt strips all references to
# memory/notes/SKILLS.md/MEMORY.md so the agent has no instruction to maintain
# persistent state. (Workspace bash/read/write tools still work.)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=<idx> python scripts/test_basic_agent.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_deepseek_v4pro_nomemory.yaml

sim_name: "claude_code_aljazeeraQ12026v37_deepseek_v4_pro_nomemory"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  sandbox: true
  prompt_mode: "no_memory"
  anthropic_base_url: "https://api.deepseek.com/anthropic"
  handholding_version: "v3"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "deepseek-v4-pro"
    timeout_seconds: 86400
    claude_code_path: "/home/nchandak/.local/bin/claude"
