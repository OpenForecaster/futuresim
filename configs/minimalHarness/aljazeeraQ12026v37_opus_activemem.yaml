# Claude Code + claude-opus-4-6 on aljazeeraQ12026v37 split with the
# active_memory prompt mode: AllQAgent-style fresh claude session each day,
# no persistent claude session, with structured memory files
# (memory/{YYYY-MM-DD}/mem.csv + meta.yaml) carrying state across days.
# Resolution dates 2026-01-01 -> 2026-03-28 (331 questions).
#
# Bootstrap from a prior baseline opus run's day 0 (2025-12-24).
# The --meta-source YAML is a per-run, hand-crafted set of meta-insights
# derived from the source run's day-0 notes; archive it into the bootstrap
# output dir (e.g. as <out_dir>/bootstrap_meta.yaml) so it lives next to
# bootstrap_provenance.json rather than cluttering shared configs/.
#
#   python scripts/bootstrap_active_memory_run.py \
#     --yaml configs/minimalHarness/aljazeeraQ12026v37_opus_activemem.yaml \
#     --source-run /fast/sgoel/forecasting/current_sim/final_runs_v37/claude_code_aljazeeraQ12026v37_opus/26-04-29-14-40-20 \
#     --source-agent-id minimalHarness_claude-opus-4-6_001 \
#     --day0 2025-12-24 \
#     --restart-from-day 2025-12-25 \
#     --meta-source <out_dir>/bootstrap_meta.yaml
#
# Then:
#   python scripts/test_basic_agent.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_opus_activemem.yaml \
#     --resume <bootstrap_out_dir>

sim_name: "claude_code_aljazeeraQ12026v37_opus_activemem"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "claude_code"
  # active_memory => fresh claude session per day; mem.csv + meta.yaml are
  # the only bridge across days. Mutually exclusive with claude_code_resume.
  prompt_mode: "active_memory"
  claude_code_resume: false
  sandbox: true

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "claude-opus-4-6"
    timeout_seconds: 86400
    claude_code_path: "/home/nchandak/.local/bin/claude"
