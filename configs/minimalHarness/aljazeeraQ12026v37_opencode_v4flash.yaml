# opencode + deepseek-v4-flash (via OpenRouter) on aljazeeraQ12026v37 split
# (331 questions, Jan-Mar 2026). Mirrors aljazeeraQ12026_deepseek_v4_flash.yaml
# (the canonical opencode template) but swaps split and output dir.
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/minimalHarness/aljazeeraQ12026v37_opencode_v4flash.yaml --runs 2

sim_name: "opencode_aljazeeraQ12026v37_deepseek_v4_flash"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "opencode"
  opencode_path: "/home/nchandak/.opencode/bin/opencode"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "deepseek/deepseek-v4-flash"
    timeout_seconds: 7200
