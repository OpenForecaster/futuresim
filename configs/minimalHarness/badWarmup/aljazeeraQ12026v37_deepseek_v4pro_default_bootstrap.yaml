# Claude Code -> DeepSeek (deepseek-v4-pro) on aljazeeraQ12026v37 with the
# default minimalHarness prompt/session mode, bootstrapped from the
# qwen3.6-plus AllQ warmup output.
#
# Bootstrap: on the first sim day, the agent copies fixedWarmup/{mem.csv,
# meta.yaml} into workspace/memory/<sim_start-1>/ and prediction.json into
# predictions/<sim_start-1>.json, then injects those predictions into the env's
# histories so my_prediction propagates to the first market.csv.
#
# This differs from the active_memory2 bootstrap config only in the prompt mode:
# no active_memory2 MCP memory workflow is used. The fixedWarmup predictions
# still seed the run as Day 0 state.
#
# Date math: lookback_days=6 + start_date=2025-12-31 => sim_start=2025-12-25,
# so the bootstrap "previous day" is 2025-12-24, matching the qwen warmup day.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py \
#     --config configs/minimalHarness/badWarmup/aljazeeraQ12026v37_deepseek_v4pro_default_bootstrap.yaml --runs 1

sim_name: "claude_code_aljazeeraQ12026v37_deepseek_v4_pro_default_bootstrap"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 6
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "${FSIM_OUTPUT_BASE}/final_runs_v37"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "${FSIM_NEWS_BASE}/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "claude_code"
  prompt_mode: "default"
  claude_code_resume: false
  sandbox: true
  # Some Condor nodes reject `bwrap --proc`; host_ro keeps filesystem
  # sandboxing intact while binding /proc read-only.
  sandbox_proc_mode: "host_ro"
  network_isolation: true
  anthropic_base_url: "https://api.deepseek.com/anthropic"
  handholding_version: "v3"
  bootstrap_dir: "${FSIM_OUTPUT_BASE}/final_runs_v37/fixedWarmup"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "deepseek-v4-pro"
    timeout_seconds: 86400
    claude_code_path: "${HOME}/.local/bin/claude"
