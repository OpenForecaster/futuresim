# Non-netiso baseline for direct timing comparison vs aljazeeraQ12026v37_glm51_netiso_2day.yaml.
# Identical to the netiso config except `network_isolation: false`.
#
# Usage:
#   python scripts/test_basic_agent.py --config configs/minimalHarness/aljazeeraQ12026v37_glm51_baseline_2day.yaml

sim_name: "claude_code_aljazeeraQ12026v37_glm51_baseline_2day"

start_date: "2026-01-01"
end_date: "2026-01-02"
resolution_start: "2026-01-01"
resolution_end: "2026-01-02"
lookback_days: 7
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  sandbox: true
  network_isolation: false
  anthropic_base_url: "https://api.z.ai/api/anthropic"
  handholding_version: "v3"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "glm-5.1"
    timeout_seconds: 3600
    claude_code_path: "/home/nchandak/.local/bin/claude"
