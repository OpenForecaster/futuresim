# Claude Code + claude-opus-4-6 on aljazeeraQ12026v37 with the active_memory
# prompt mode, bootstrapped from the qwen3.6-plus AllQ warmup output (same
# fixedWarmup directory used by the v4-pro bootstrap run).
#
# Bootstrap: on the first sim day, the agent copies fixedWarmup/{mem.csv,
# meta.yaml} into workspace/memory/<sim_start-1>/ and prediction.json into
# predictions/<sim_start-1>.json, then injects those predictions into the env's
# histories so my_prediction propagates to Day 1 market.csv.
#
# Date math: lookback_days=6 + start_date=2025-12-31 => sim_start=2025-12-25,
# so the bootstrap "previous day" is 2025-12-24, matching the qwen warmup day.
#
# Usage:
#   python mpi_scripts/run_sim/submit_sim.py \
#     --config configs/minimalHarness/aljazeeraQ12026v37_opus_activemem_bootstrap.yaml --runs 1

sim_name: "claude_code_aljazeeraQ12026v37_opus_activemem_bootstrap"

start_date: "2025-12-31"
end_date: "2026-03-28"
resolution_start: "2025-12-31"
resolution_end: "2026-03-28"
lookback_days: 6
search_cutoff_days: 0
timegap_days: 1

dataset: "openforesight"
dataset_path: "${FSIM_DATASET_PATH}"
split: "aljazeeraQ12026v37"
resolved_only: false
min_forecasters: 0
output_base: "/fast/sgoel/forecasting/current_sim/final_runs_v37/"

search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
articles_base: "/fast/sgoel/forecasting/news/deduped_articles/data"

matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"

defaults:
  provider: "none"
  scaffold: "minimalHarness"
  harness_backend: "claude_code"
  # active_memory => fresh claude session per day; mem.csv + meta.yaml are
  # the only bridge across days. Mutually exclusive with claude_code_resume.
  prompt_mode: "active_memory"
  claude_code_resume: false
  sandbox: true
  # Some Condor nodes reject `bwrap --proc` (cluster 17157902 hit this and the
  # harness died with exit 1 on every day). host_ro binds /proc read-only —
  # less process isolation but keeps filesystem sandboxing intact.
  sandbox_proc_mode: "host_ro"
  # Egress through a host-side allowlist proxy (default allowlist covers
  # *.anthropic.com:443, which is all opus needs for the direct Anthropic API).
  network_isolation: true
  bootstrap_dir: "/fast/sgoel/forecasting/current_sim/final_runs_v37/fixedWarmup/"

resources:
  gpus: 1
  cpus: 16
  memory_gb: 80
  disk_gb: 50
  bid: 35

agents:
  - model: "claude-opus-4-6"
    timeout_seconds: 86400
    claude_code_path: "/home/nchandak/.local/bin/claude"
