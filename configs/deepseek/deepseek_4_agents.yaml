# DeepSeek 4-Agent Simulation Configuration
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/deepseek/deepseek_4_agents.yaml

# --- Simulation Meta ---
sim_name: "deepseekv32_selfplay"
start_date: "2025-05-01" 
end_date: "2025-08-23"   
resolution_start: "2025-05-01"
resolution_end: "2025-08-23"
lookback_days: 7         
search_cutoff_days: 0    
split: "test"            

# --- Data Paths ---
dataset: ""
output_base: "${FSIM_OUTPUT_BASE}"

# --- Search Settings ---
search_db: "${FSIM_SEARCH_DB}"
embedding_model: "${FSIM_EMBEDDING_MODEL}"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0         
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "basic"
  max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3

agents:
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
  - model: "deepseek/deepseek-v3.2"
