# Memory A/B test: MEMORY DISABLED restart. Restarts from shared warmup run with enable_memory=false.
#
# Before using: replace <WARMUP_RUN_DIR> with the actual output directory from the warmup-only run (allq_warmup_only).
#
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/allq_nomem_restart.yaml --runs 1

# --- Restart ---
restart_from: "/fast/sgoel/forecasting/current_sim/allq_warmup_only_r00/gemini-3-flash-testset"
# restart_from: "/fast/sgoel/forecasting/current_sim/allq_warmup_only_r00/gemini-3-flash-skysports"
restart_from_day: "2025-04-25"

# --- Simulation Meta ---
sim_name: "allq_nomem_gemini_3_flash_testset-40actions"
start_date: "2025-05-01"
# end_date: "2025-12-14"
end_date: "2025-08-23"
lookback_days: 7
search_cutoff_days: 0
split: "test"

# --- Data Paths ---
dataset: "openforesight"
dataset_path: "/fast/nchandak/datasets/OpenForesight"
min_forecasters: 10
resolved_only: true
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  enable_memory: false
  max_actions: 40
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 32768
  max_retries: 3
  reasoning: 
    effort: "high"

agents:
  - model: "google/gemini-3-flash-preview"
    provider: "openrouter"
