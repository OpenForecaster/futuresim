# Metaculus AllQAgent Simulation Configuration
# Usage: python mpi_scripts/run_sim/submit_sim.py --config configs/metaculus_sim.yaml --runs 1

# --- Simulation Meta ---
sim_name: "metaculus_allq_sim"
start_date: "2025-04-01" # Resolution window start
end_date: "2025-08-30"   # Resolution window end
lookback_days: 7         # Days before first resolution to start simulation
search_cutoff_days: 0    # Cap on search date based on current date in sim
split: "test"            # Dataset split (not used for Metaculus, kept for consistency)

# --- Data Paths ---
dataset: "metaculus_binary"
dataset_path: ""  # Not used for Metaculus
dataset_cache: "/is/cluster/fast/sgoel/forecasting/qs/cache"
min_forecasters: 10      # Volume filter: require at least 10 forecasters
resolved_only: true      # Only load resolved questions
output_base: "/is/cluster/fast/sgoel/forecasting/current_sim"
warmup_parallelism: 64

# --- Search Settings ---
# Leave search_db empty to disable search
search_db: "/is/cluster/fast/sgoel/forecasting/news/deduped_articles/lance/Qwen3-Embedding-8B"
embedding_model: "/is/cluster/fast/sgoel/models/Qwen3-Embedding-8B"
embedding_gpu_mem: 0.7

# --- Answer Matching ---
# Note: Metaculus uses exact matching (Yes/No), VLLM matcher not needed but kept for consistency
matching: "openrouter"
matcher: "deepseek/deepseek-v3.2"
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0         # OpenRouter requests/second
parallel: true

# --- Agents Configuration ---
defaults:
  provider: "openrouter"
  scaffold: "allQ"
  max_actions: 10
  warmup_max_actions: 10
  temperature: 0.7
  max_tokens: 2048
  max_retries: 3
  
agents:
  - model: "deepseek/deepseek-v3.2"
    provider: "openrouter"
    # You can override defaults here
