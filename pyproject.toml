[project]
name = "forecast-sim"
version = "0.1.0"
description = "Forecasting simulation environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==0.71.0",
    "datasets==4.4.2",
    "httpx==0.28.1",
    "huggingface-hub==0.36.0",
    "lancedb==0.29.1",
    "mcp==1.25.0",
    "openai==2.15.0",
    "openai-harmony==0.0.8",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "sentence-transformers==5.2.0",
    "torch==2.10.0",
    "transformers==4.57.4",
    "vllm==0.18.0",
]

[tool.uv]
dev-dependencies = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
