[project]
name = "futuresim"
version = "0.1.1"
description = "Futuresim forecasting simulation environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["forecasting", "evaluation", "verifiers", "openreward", "ors"]
tags = ["forecasting", "agent", "simulation", "verifiers", "openreward"]
dependencies = [
    "datasets==4.4.2",
    "httpx==0.28.1",
    "huggingface-hub==0.36.0",
    "mcp==1.25.0",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "requests==2.32.5",
]

[project.urls]
Repository = "https://github.com/OpenForecaster/futuresim"
Documentation = "https://github.com/OpenForecaster/futuresim#readme"

[project.optional-dependencies]
verifiers = [
    "prime-sandboxes>=0.2.26",
    "verifiers>=0.1.14",
]
openreward = [
    "fastapi>=0.115.12",
    "openreward>=0.1.126",
    "uvicorn>=0.34.3",
]
hybrid-search = [
    "lancedb==0.29.1",
    "lance-namespace==0.4.5",
    "pylance>=1.0.0b14",
    "tantivy==0.25.0",
]
local-embeddings = [
    "sentence-transformers==5.2.0",
    "torch==2.10.0",
    "transformers==4.57.4",
]
vllm = [
    "vllm==0.18.0",
]
hosted = [
    "fastapi>=0.115.12",
    "openreward>=0.1.126",
    "prime-sandboxes>=0.2.26",
    "uvicorn>=0.34.3",
    "verifiers>=0.1.14",
]
hosted-hybrid = [
    "fastapi>=0.115.12",
    "lancedb==0.29.1",
    "lance-namespace==0.4.5",
    "openreward>=0.1.126",
    "prime-sandboxes>=0.2.26",
    "pylance>=1.0.0b14",
    "tantivy==0.25.0",
    "uvicorn>=0.34.3",
    "verifiers>=0.1.14",
]

[project.scripts]
futuresim-openreward-server = "integrations.openreward.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "agents",
    "environment",
    "futuresim.py",
    "inference",
    "integrations",
    "pathing.py",
    "server.py",
]

[tool.hatch.build.targets.wheel.sources]
agents = "futuresim_agents"

[tool.uv]
dev-dependencies = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
